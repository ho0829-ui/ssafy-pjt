{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}로그인 · Books{% endblock title %}

{% block content %}
  <div class="page-narrow mx-auto">
    <h1 class="h3 fw-bold mb-4">로그인</h1>
    <form action="{% url 'accounts:login' %}" method="POST" novalidate>
      {% csrf_token %}
      {% bootstrap_form form %}
      <button class="btn btn-dark w-100 py-2">로그인</button>
    </form>
    <p class="text-center text-body-secondary small mt-4 mb-0">
      아직 회원이 아니신가요? <a href="{% url 'accounts:signup' %}" class="link-dark">회원가입</a>
    </p>
  </div>
{% endblock content %}
