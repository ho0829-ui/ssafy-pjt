{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}비밀번호 변경 · Books{% endblock title %}

{% block content %}
  <div class="page-narrow mx-auto">
    <h1 class="h3 fw-bold mb-4">비밀번호 변경</h1>
    <form action="{% url 'change_password' user.pk %}" method="POST" novalidate>
      {% csrf_token %}
      {% bootstrap_form form %}
      <button class="btn btn-dark w-100 py-2">비밀번호 변경</button>
    </form>
  </div>
{% endblock content %}
