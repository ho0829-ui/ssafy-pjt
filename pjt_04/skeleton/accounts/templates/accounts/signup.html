{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}회원가입 · Books{% endblock title %}

{% block content %}
  <div class="page-narrow mx-auto">
    <h1 class="h3 fw-bold mb-4">회원가입</h1>
    <form action="{% url 'accounts:signup' %}" method="POST" novalidate>
      {% csrf_token %}
      {% bootstrap_form form %}
      <button class="btn btn-dark w-100 py-2">가입하기</button>
    </form>
    <p class="text-center text-body-secondary small mt-4 mb-0">
      이미 계정이 있으신가요? <a href="{% url 'accounts:login' %}" class="link-dark">로그인</a>
    </p>
  </div>
{% endblock content %}
