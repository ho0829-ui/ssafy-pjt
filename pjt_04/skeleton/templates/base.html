<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Books{% endblock title %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      word-break: keep-all;
    }
    .navbar-brand { font-weight: 700; letter-spacing: -0.02em; }
    .page { max-width: 760px; }
    .page-narrow { max-width: 420px; }
    .navbar-toggler:focus { box-shadow: none; }
    /* 에러가 없는 입력칸은 초록색 대신 기본 모양 유지 */
    .form-control.is-valid { border-color: var(--bs-border-color); background-image: none; padding-right: .75rem; }
    .form-control.is-valid:focus { border-color: #86b7fe; box-shadow: 0 0 0 .25rem rgba(13, 110, 253, .25); }
  </style>
</head>
<body class="bg-body">
  <nav class="navbar navbar-expand-md bg-body border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'books:index' %}">Books</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="메뉴 열기">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-md-center">
          {% if user.is_authenticated %}
            <li class="nav-item"><a class="nav-link" href="{% url 'books:create' %}">도서 등록</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:update' %}">회원정보수정</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'change_password' user.pk %}">비밀번호 변경</a></li>
            <li class="nav-item">
              <form action="{% url 'accounts:logout' %}" method="POST">
                {% csrf_token %}
                <button class="nav-link">로그아웃</button>
              </form>
            </li>
            <li class="nav-item">
              <form action="{% url 'accounts:delete' %}" method="POST" onsubmit="return confirm('정말 탈퇴하시겠어요?');">
                {% csrf_token %}
                <button class="nav-link text-danger">회원탈퇴</button>
              </form>
            </li>
            <li class="nav-item d-none d-md-block border-start ms-2 ps-3">
              <span class="navbar-text small">{{ user.username }}님</span>
            </li>
          {% else %}
            <li class="nav-item"><a class="nav-link" href="{% url 'accounts:login' %}">로그인</a></li>
            <li class="nav-item ms-md-2">
              <a class="btn btn-dark btn-sm my-2 my-md-0" href="{% url 'accounts:signup' %}">회원가입</a>
            </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4 py-md-5">
    {% block content %}
    {% endblock content %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
