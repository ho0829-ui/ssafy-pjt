{% extends 'base.html' %}
{% load django_bootstrap5 %}

{% block title %}도서 수정 · Books{% endblock title %}

{% block content %}
  <div class="page mx-auto">
    <a href="{% url 'books:detail' book.pk %}" class="link-secondary text-decoration-none small">&larr; 돌아가기</a>
    <h1 class="h3 fw-bold mt-2 mb-4">도서 수정</h1>
    <form action="{% url 'books:update' book.pk %}" method="POST" novalidate>
      {% csrf_token %}
      {% bootstrap_form form %}
      <div class="d-grid d-sm-flex justify-content-sm-end gap-2">
        <a href="{% url 'books:detail' book.pk %}" class="btn btn-outline-secondary px-4">취소</a>
        <button class="btn btn-dark px-4">저장</button>
      </div>
    </form>
  </div>
{% endblock content %}
