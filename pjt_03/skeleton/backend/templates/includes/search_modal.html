<!-- 도서 검색 오버레이: Navbar "도서 검색"으로 열림 -->
<div
  class="modal fade search-modal"
  id="searchModal"
  tabindex="-1"
  aria-labelledby="searchModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-body">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h2 class="search-modal-title" id="searchModalLabel">도서 검색</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>

        <form class="search-form" action="{% url 'books:search' %}" method="get" role="search">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input
            type="search"
            name="q"
            class="form-control"
            placeholder="제목, 저자, 출판사로 검색"
            maxlength="100"
            autocomplete="off"
            aria-label="검색어"
            required
          />
          <button type="submit" class="btn btn-brand">검색</button>
        </form>

        <!-- 최근 검색어: 브라우저(localStorage)에만 저장, JS가 채움 -->
        <div class="search-recent" hidden>
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="search-label">최근 검색어</span>
            <button type="button" class="btn btn-link btn-sm p-0 search-recent-clear">전체 삭제</button>
          </div>
          <div class="d-flex flex-wrap gap-2 search-recent-list"></div>
        </div>

        <div class="mt-4">
          <span class="search-label d-block mb-2">장르로 둘러보기</span>
          <div class="d-flex flex-wrap gap-2">
            {% for genre in all_genres %}
            <a class="search-chip" href="{% url 'books:genre' genre.slug %}">{{ genre.name }}</a>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
