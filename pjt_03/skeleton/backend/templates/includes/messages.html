{# 로그인·가입·로그아웃 등 알림: 오른쪽 아래 토스트로 잠깐 표시 (main.js가 띄움) #}
{% if messages %}
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  {% for message in messages %}
  <div class="toast thread-toast" role="status" aria-live="polite" aria-atomic="true" data-bs-delay="3500">
    <div class="d-flex align-items-center">
      <div class="toast-body">
        <i class="bi {% if message.level_tag == 'success' %}bi-check-circle-fill{% else %}bi-info-circle-fill{% endif %} me-2"></i>{{ message }}
      </div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="닫기"></button>
    </div>
  </div>
  {% endfor %}
</div>
{% endif %}
