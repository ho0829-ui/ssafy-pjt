<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Bestseller</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }

      body {
        margin: 0;
        padding: 0;
        color: #333;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .section-title {
        font-family: "GmarketSansTTFMedium";
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }

      /* 베스트셀러 Carousel */
      .bestseller .carousel-inner {
        padding: 0 3rem; /* Next 버튼이 책을 가리지 않도록 여백 확보 */
      }
      .bestseller .carousel-control-next {
        width: 3rem;
      }
      .book-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.5rem;
        margin: 0 auto;
        max-width: calc(150px * 4 + 1.5rem * 3); /* 한 줄에 4권 */
      }
      .book {
        width: 150px;
      }
      .book-cover {
        width: 150px;
        height: 220px;
        object-fit: cover;
        display: block;
      }
      .book-title {
        margin: 0.5rem 0 0;
        font-size: 0.9rem;
        text-align: center;
      }
      /* 4권이 한 줄에 들어가지 않는 폭에서는 2×2로 배치 */
      @media (max-width: 991.98px) {
        .book-row {
          max-width: calc(150px * 2 + 1.5rem);
        }
      }
      /* 모바일: 2권이 나란히 들어가도록 여백·간격 축소 */
      @media (max-width: 575.98px) {
        .bestseller .carousel-inner {
          padding: 0;
        }
        .bestseller .carousel-control-next {
          width: 1.5rem;
        }
        .bestseller .carousel-control-next-icon {
          width: 1.5rem;
          height: 1.5rem;
        }
        .book-row {
          gap: 1rem;
          max-width: calc(150px * 2 + 1rem);
        }
      }
    </style>
  </head>
  <body>
    <!-- 베스트셀러 섹션 -->
    <section class="bestseller py-5">
      <div class="container bestseller-container">
        <div class="row align-items-center">
          <div class="col-lg-2 mb-4 mb-lg-0">
            <h3 class="section-title">베스트셀러</h3>
          </div>
          <div class="col-lg-10">
            <div
              id="bestsellerCarousel"
              class="carousel slide"
              data-bs-ride="carousel"
              data-bs-theme="dark"
            >
              <div class="carousel-inner">
                <!-- 슬라이드 1 -->
                <div class="carousel-item active">
                  <div class="book-row">
                    <div class="book">
                      <img src="assets/bestsellers/img1.jpeg" alt="소년이 온다" class="book-cover" />
                      <p class="book-title text-truncate">소년이 온다</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img2.jpeg" alt="채식주의자" class="book-cover" />
                      <p class="book-title text-truncate">채식주의자</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img3.jpeg" alt="대온실 수리 보고서" class="book-cover" />
                      <p class="book-title text-truncate">대온실 수리 보고서</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img4.jpeg" alt="급류" class="book-cover" />
                      <p class="book-title text-truncate">급류</p>
                    </div>
                  </div>
                </div>
                <!-- 슬라이드 2 -->
                <div class="carousel-item">
                  <div class="book-row">
                    <div class="book">
                      <img src="assets/bestsellers/img5.jpeg" alt="시간의 계곡" class="book-cover" />
                      <p class="book-title text-truncate">시간의 계곡</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img6.jpeg" alt="인간 실격" class="book-cover" />
                      <p class="book-title text-truncate">인간 실격</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img7.jpeg" alt="노르웨이의 숲" class="book-cover" />
                      <p class="book-title text-truncate">노르웨이의 숲</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img8.jpeg" alt="정원에 대하여" class="book-cover" />
                      <p class="book-title text-truncate">정원에 대하여</p>
                    </div>
                  </div>
                </div>
                <!-- 슬라이드 3 -->
                <div class="carousel-item">
                  <div class="book-row">
                    <div class="book">
                      <img src="assets/bestsellers/img9.jpeg" alt="네 칼이 센가, 내 칼이 센가" class="book-cover" />
                      <p class="book-title text-truncate">네 칼이 센가, 내 칼이 센가</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img10.jpeg" alt="새벽의 사원" class="book-cover" />
                      <p class="book-title text-truncate">새벽의 사원</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img11.jpeg" alt="위싱머신" class="book-cover" />
                      <p class="book-title text-truncate">위싱머신</p>
                    </div>
                    <div class="book">
                      <img src="assets/bestsellers/img12.jpeg" alt="모순" class="book-cover" />
                      <p class="book-title text-truncate">모순</p>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Next 버튼만 출력 -->
              <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#bestsellerCarousel"
                data-bs-slide="next"
              >
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
