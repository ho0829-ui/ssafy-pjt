<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Genre (CSS Grid)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }

      .genre-books {
        width: 80%;
        margin: 0 auto;
        padding: 3rem 0;
      }
      .section-title {
        font-family: "GmarketSansTTFMedium";
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0 0 1.5rem;
      }

      /* F310: CSS Grid 벤토 레이아웃 (4열 × 5줄) */
      .genre-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 160px;
        gap: 1rem;
        grid-template-areas:
          "art art sci his"
          "art art sci his"
          "eco eco tra bab"
          "phi rom you you"
          "phi rom hea hea";
      }
      .genre-art { grid-area: art; }
      .genre-sci { grid-area: sci; }
      .genre-his { grid-area: his; }
      .genre-eco { grid-area: eco; }
      .genre-tra { grid-area: tra; }
      .genre-bab { grid-area: bab; }
      .genre-phi { grid-area: phi; }
      .genre-rom { grid-area: rom; }
      .genre-you { grid-area: you; }
      .genre-hea { grid-area: hea; }

      .genre-item {
        position: relative;
        overflow: hidden;
        border-radius: 0.5rem;
      }
      .genre-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      /* 장르명이 잘 보이도록 하단에 옅은 그라데이션 */
      .genre-item::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.6), transparent 50%);
      }
      .genre-name {
        position: absolute;
        left: 1rem;
        bottom: 0.75rem;
        z-index: 1;
        color: #fff;
        font-family: "SBAggro_L";
        font-size: 1.1rem;
      }

      /* 대표 타일(예술) 강조 */
      .genre-art .genre-name {
        left: 1.25rem;
        bottom: 1.25rem;
        font-size: 1.8rem;
      }
      .genre-badge {
        position: absolute;
        top: 1rem;
        left: 1rem;
        z-index: 1;
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        background: #fe4a51;
        color: #fff;
        font-family: "SBAggro_L";
        font-size: 0.8rem;
      }

      /* 태블릿·모바일: 2열 벤토 */
      @media (max-width: 991.98px) {
        .genre-grid {
          grid-template-columns: repeat(2, 1fr);
          grid-auto-rows: 140px;
          grid-template-areas:
            "art art"
            "art art"
            "sci his"
            "sci his"
            "eco eco"
            "tra bab"
            "phi rom"
            "phi rom"
            "you you"
            "hea hea";
        }
      }
      @media (max-width: 575.98px) {
        .genre-grid {
          grid-auto-rows: 110px;
          gap: 0.75rem;
        }
        .genre-art .genre-name {
          font-size: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <section class="genre-books">
      <h3 class="section-title">장르별 도서 목록</h3>
      <div class="genre-grid">
        <div class="genre-item genre-art">
          <img src="assets/genre/art.jpg" alt="예술" />
          <span class="genre-badge">이번 주 인기 장르</span>
          <span class="genre-name">예술</span>
        </div>
        <div class="genre-item genre-sci">
          <img src="assets/genre/natural_science.jpg" alt="자연과학" />
          <span class="genre-name">자연과학</span>
        </div>
        <div class="genre-item genre-his">
          <img src="assets/genre/history.jpg" alt="역사" />
          <span class="genre-name">역사</span>
        </div>
        <div class="genre-item genre-eco">
          <img src="assets/genre/economy.jpg" alt="경제/경영" />
          <span class="genre-name">경제/경영</span>
        </div>
        <div class="genre-item genre-tra">
          <img src="assets/genre/travel.jpg" alt="여행" />
          <span class="genre-name">여행</span>
        </div>
        <div class="genre-item genre-bab">
          <img src="assets/genre/baby.jpg" alt="유아" />
          <span class="genre-name">유아</span>
        </div>
        <div class="genre-item genre-phi">
          <img src="assets/genre/philosophy.jpg" alt="철학" />
          <span class="genre-name">철학</span>
        </div>
        <div class="genre-item genre-rom">
          <img src="assets/genre/romance.jpg" alt="로맨스" />
          <span class="genre-name">로맨스</span>
        </div>
        <div class="genre-item genre-you">
          <img src="assets/genre/youth.jpg" alt="청소년" />
          <span class="genre-name">청소년</span>
        </div>
        <div class="genre-item genre-hea">
          <img src="assets/genre/health.jpg" alt="건강" />
          <span class="genre-name">건강</span>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
